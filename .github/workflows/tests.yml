name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,svg]'
      - run: python -m pytest -q
      - run: PYTHONPATH=src python benchmarks/run.py --output artifacts/benchmark.json
      - run: PYTHONPATH=src python benchmarks/compare_routing.py --output artifacts/routing-comparison.json
      - run: PYTHONPATH=src python benchmarks/run_sequences.py --output artifacts/edit-sequences.json
      - run: PYTHONPATH=src python benchmarks/learn_attachments.py --train-scenes 300 --model artifacts/test-ranker.json --output artifacts/attachment-learning.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-python-${{ matrix.python }}
          path: artifacts/*.json
  elk-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e .
      - run: npm ci --ignore-scripts
      - run: PYTHONPATH=src python benchmarks/compare_elk.py --output artifacts/elk-comparison.json
      - run: PYTHONPATH=src python benchmarks/run_sequences.py --elk --output artifacts/edit-sequences.json
      - uses: actions/upload-artifact@v4
        with:
          name: elk-comparison
          path: artifacts/*.json
  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[svg]'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node benchmarks/browser_check.cjs
      - run: node benchmarks/compound_check.cjs
      - run: node benchmarks/presentation_check.cjs
      - run: node benchmarks/native_pilot_check.cjs
      - run: node benchmarks/compare_parallel_routing.cjs
      - run: node benchmarks/native_presentation_check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: browser-integration
          path: |
            artifacts/browser-*
            artifacts/compound-integration.json
            artifacts/presentation-*
            artifacts/native-pilot/report.json
            artifacts/native-pilot-check.json
            artifacts/native-presentation-check.json
            artifacts/parallel-routing/report.json
