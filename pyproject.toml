[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-recovery"
version = "0.1.0"
description = "Recover explicit relationships from simple SVG diagrams and check constraint-based edits."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "Pillow>=10.1", "defusedxml>=0.7"]

[project.optional-dependencies]
test = ["pytest>=7", "jsonschema>=4.18"]
svg = ["tinycss2>=1.4", "cssselect2>=0.8", "svgpathtools>=1.6"]

[project.scripts]
constraint-recovery = "constraint_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
constraint_recovery = ["assets/*.html", "assets/*.cjs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
